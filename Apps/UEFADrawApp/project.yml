# XcodeGen-Spezifikation fuer das iOS-App-Target.
#
# Das .xcodeproj wird aus dieser Datei erzeugt und ist damit reproduzierbar.
# Neu generieren mit:
#
#   cd Apps/UEFADrawApp && xcodegen generate
#
# Die Fachlogik kommt aus dem DrawEngine-Package im Repo-Wurzelverzeichnis.

name: UEFADrawApp

options:
  bundleIdPrefix: com.uefaauslosung
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

packages:
  DrawEngine:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:

  UEFADrawApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Tests/**"
      - path: Resources
    dependencies:
      - package: DrawEngine
        product: DrawEngine
    settings:
      base:
        PRODUCT_NAME: UEFADrawApp
        PRODUCT_BUNDLE_IDENTIFIER: com.uefaauslosung.drawapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Auslosung
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  UEFADrawAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/Tests
    dependencies:
      - target: UEFADrawApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uefaauslosung.drawapp.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:

  UEFADrawApp:
    build:
      targets:
        UEFADrawApp: all
        UEFADrawAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UEFADrawAppTests
